name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 图标是二进制文件，无法直接粘贴进仓库，改存为 base64 文本，构建时还原
      - name: 还原应用图标
        run: |
          test -f tools/app_icon.b64 || { echo "缺少 tools/app_icon.b64"; exit 1; }
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          base64 -d tools/app_icon.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
          ls -l app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
          file app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg || true

      # runner 自带 Android SDK，直接用它自带的 sdkmanager 装需要的组件
      - name: 安装 SDK 平台与构建工具
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKM=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKM"
          if [ -z "$SDKM" ]; then
            echo "找不到 sdkmanager"; exit 1
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 准备 Gradle（固定 8.7，免去 gradle-wrapper.jar）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 把产物改成中文名，下载下来就是「修仙脚本工具.apk」而不是 app-debug.apk
      - name: 重命名为中文安装包名
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          echo "源文件: $SRC"
          if [ -z "$SRC" ]; then
            echo "没有找到 APK"; exit 1
          fi
          cp "$SRC" "dist/修仙脚本工具.apk"
          ls -l dist/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 修仙脚本工具
          path: dist/修仙脚本工具.apk
          if-no-files-found: error

      # 额外发一个 Release：手机上点链接就能直接下载，不用登录 GitHub
      - name: 发布到 Release（可直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 修仙脚本工具 构建 ${{ github.run_number }}
          body: |
            自动构建产物，点下面的 apk 直接下载安装。

            - 适配任意分辨率/DPI（优先按界面文字与颜色识别，不依赖固定坐标）
            - 支持按游戏分别管理账号，勾选后逐个运行
          files: dist/修仙脚本工具.apk
          make_latest: true
